# KEY CHANGE: removed the /api/video-info and /api/playlist-info redirect rules.
#
# Both functions use Netlify Functions v2 (export default async function handler(req, ctx))
# with "export const config = { path }" at the bottom of each file.
# v2 functions register their path DIRECTLY — Netlify routes requests to them
# before the SPA fallback fires. Adding a redirect that points to
# /.netlify/functions/* does NOT work for v2 functions (that URL only works for
# old v1 functions) and causes the SPA fallback to serve index.html instead,
# which is why resp.json() was throwing "Unexpected response (status 404/200-HTML)".
#
# Other fixes still in place:
#   • No [build].base — functions directory resolves from repo root correctly.
#   • pip install yt-dlp removed — yt-dlp is not accessible in Lambda runtime.

[build]
  publish = "artifacts/m4a-downloader/dist/public"
  command = "cd artifacts/m4a-downloader && npm run build"

[build.environment]
  NODE_VERSION   = "20"
  PYTHON_VERSION = "3.11"

# /api/video-info    — handled by netlify/functions/video-info.mts    (config.path)
# /api/playlist-info — handled by netlify/functions/playlist-info.mts (config.path)
# NO redirects for those two paths — v2 functions own them directly.

[functions]
  directory        = "netlify/functions"
  node_bundler     = "esbuild"
  included_files   = ["netlify/functions/**"]

[functions."video-info"]
  timeout = 10

[functions."playlist-info"]
  timeout = 26

# Downloads — still need proxying to the persistent Express backend
[[redirects]]
  from   = "/api/downloads/:jobId/events"
  to     = ":BACKEND_URL/api/downloads/:jobId/events"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/downloads/:jobId/file"
  to     = ":BACKEND_URL/api/downloads/:jobId/file"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/downloads"
  to     = ":BACKEND_URL/api/downloads"
  status = 200
  force  = true

# SPA fallback — serves index.html for all unmatched paths.
# v2 function paths (/api/video-info, /api/playlist-info) are matched by
# Netlify BEFORE this rule, so they never reach the SPA fallback.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
