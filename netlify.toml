# PATCH: Bug 4 – Removed useless `pip install yt-dlp` from build command.
#
# yt-dlp was installed during build but Netlify functions run in AWS Lambda
# where the build container's filesystem is not accessible. Installing yt-dlp
# at build time added ~20–30 s to every deploy and gave a false sense of
# security. The video-info and playlist-info functions have been rewritten to
# use pure-HTTP calls (Invidious API) so no Python binary is needed.
#
# NOTE: Actual audio *downloads* (POST /api/downloads, SSE events, file serve)
# require the Express back-end running on a persistent server (e.g. Render,
# Railway). Set BACKEND_URL in the Netlify dashboard to your deployed
# Express server's root URL (e.g. https://my-api.onrender.com).

[build]
  base    = "artifacts/m4a-downloader"
  publish = "dist/public"
  command = "npm run build"   # ← removed `pip install yt-dlp &&` (see note above)

[build.environment]
  NODE_VERSION   = "20"
  PYTHON_VERSION = "3.11"

# ─── Netlify Functions ────────────────────────────────────────────────────────
# video-info     → netlify/functions/video-info.mts    (pure HTTP, < 15 s)
# playlist-info  → netlify/functions/playlist-info.mts (pure HTTP, < 15 s)
# downloads/*    → proxied to BACKEND_URL (persistent Express server)
# ─────────────────────────────────────────────────────────────────────────────

[[redirects]]
  from   = "/api/video-info"
  to     = "/.netlify/functions/video-info"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/playlist-info"
  to     = "/.netlify/functions/playlist-info"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/downloads/:jobId/events"
  to     = ":BACKEND_URL/api/downloads/:jobId/events"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/downloads/:jobId/file"
  to     = ":BACKEND_URL/api/downloads/:jobId/file"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/downloads"
  to     = ":BACKEND_URL/api/downloads"
  status = 200
  force  = true

[functions]
  directory        = "netlify/functions"
  node_bundler     = "esbuild"
  included_files   = ["netlify/functions/**"]

[functions."video-info"]
  timeout = 26

[functions."playlist-info"]
  timeout = 26    # ← reduced from 60 s; each instance probe now times out at 15 s

# SPA fallback — all unmatched routes serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200