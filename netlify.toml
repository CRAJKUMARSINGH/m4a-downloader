# PATCH v3 — Two bugs fixed
#
# ── Bug A (404 on all functions) ──────────────────────────────────────────────
# When [build].base is set, Netlify resolves [functions].directory relative to
# that base directory.  With base="artifacts/m4a-downloader", the path
# "netlify/functions" resolved to "artifacts/m4a-downloader/netlify/functions"
# which does not exist → Netlify registered zero functions → every call to
# /api/video-info and /api/playlist-info returned 404.
#
# Fix: remove [build].base and spell out paths from the repository root.
# Now [functions].directory = "netlify/functions" correctly resolves to
# <repo-root>/netlify/functions where the functions actually live.
#
# ── Bug B (playlist-info used dead Invidious/Piped instances) ─────────────────
# All third-party Invidious and Piped public instances are shut down or blocking
# requests.  The playlist-info Netlify function has been rewritten as a thin
# proxy to the Express API server (BACKEND_URL), which already has a working
# yt-dlp-powered GET /api/playlist-info route.
# Set BACKEND_URL in the Netlify dashboard to your deployed Express server root
# (e.g. https://my-api.onrender.com).  The function returns a 503 with a clear
# setup message if BACKEND_URL is not yet configured.
#
# ── Bug C (useless pip install) ───────────────────────────────────────────────
# Removed `pip install yt-dlp` from the build command — yt-dlp installed at
# build time is never reachable inside Netlify's Lambda function runtime.

[build]
  # No `base` — all paths are relative to the repository root.
  publish = "artifacts/m4a-downloader/dist/public"
  command = "cd artifacts/m4a-downloader && npm run build"

[build.environment]
  NODE_VERSION   = "20"
  PYTHON_VERSION = "3.11"

# ─── Netlify Functions ────────────────────────────────────────────────────────
# /api/video-info    → Netlify function  (YouTube oEmbed, no backend needed)
# /api/playlist-info → Netlify function  (proxies to BACKEND_URL/api/playlist-info)
# /api/downloads/*   → Express backend   (BACKEND_URL must be set)
# ─────────────────────────────────────────────────────────────────────────────

[[redirects]]
  from   = "/api/video-info"
  to     = "/.netlify/functions/video-info"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/playlist-info"
  to     = "/.netlify/functions/playlist-info"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/downloads/:jobId/events"
  to     = ":BACKEND_URL/api/downloads/:jobId/events"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/downloads/:jobId/file"
  to     = ":BACKEND_URL/api/downloads/:jobId/file"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/downloads"
  to     = ":BACKEND_URL/api/downloads"
  status = 200
  force  = true

[functions]
  directory        = "netlify/functions"   # relative to repo root (no base set above)
  node_bundler     = "esbuild"
  included_files   = ["netlify/functions/**"]

[functions."video-info"]
  timeout = 10    # oEmbed is fast; 10 s is plenty

[functions."playlist-info"]
  timeout = 26    # proxy call; Express/yt-dlp does the heavy work

# SPA fallback — all unmatched routes serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
